{% extends "base.html" %}
{% block title %}Registar Utilização{% endblock %}
{% block content %}
<div class="page-header">
  <h3><i class="fa-solid fa-clipboard-list"></i> Registar Utilização de Equipamento</h3>
</div>

<div class="card">
  <div class="card-body">
    {% if equipamentos %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Equipamento *</label>
        <select class="form-select" name="equipamento_id" required>
          <option value="" disabled selected>Escolhe um equipamento disponível...</option>
          {% for e in equipamentos %}
          <option value="{{ e.id_equipamento }}">{{ e.designacao }} ({{ e.numero_inventario }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Observações</label>
        <textarea class="form-control" name="observacoes" rows="3" placeholder="Opcional"></textarea>
      </div>
      <button type="submit" class="btn btn-brand"><i class="fa-solid fa-play"></i> Iniciar Utilização</button>
    </form>
    {% else %}
    <p class="text-muted mb-0">Não existem equipamentos disponíveis neste momento.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
